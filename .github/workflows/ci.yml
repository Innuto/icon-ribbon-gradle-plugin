name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Test and validate plugin
        run: ./gradlew -p plugin test validatePlugins functionalTest

      - name: Build sample app (end-to-end)
        run: ./gradlew :sample:assembleDebug :sample:assembleRelease

  # Functional tests against other AGP / Gradle pairs than the one the plugin is built with
  # (AGP 8.10.1, covered by the `build` job). Keep the first entry in sync with "Requirements" in the README.
  compatibility:
    name: AGP ${{ matrix.agp }} / Gradle ${{ matrix.gradle }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - agp: "8.4.2"    # oldest supported
            gradle: "8.6"
          - agp: "8.13.2"   # latest 8.x
            gradle: "8.14.8"
          - agp: "9.5.2"    # latest
            gradle: "9.9.2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Functional tests
        run: ./gradlew -p plugin functionalTest -PtestAgpVersion=${{ matrix.agp }} -PtestGradleVersion=${{ matrix.gradle }}
