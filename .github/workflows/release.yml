name: Release

# Push a tag like v0.2.0 (matching `version` in plugin/gradle.properties) to publish.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches plugin version
        run: |
          version=$(grep '^version=' plugin/gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version=$version in plugin/gradle.properties"
            exit 1
          fi

      - name: Test
        run: ./gradlew -p plugin test validatePlugins :sample:assembleDebug

      - name: Publish to Gradle Plugin Portal
        run: ./gradlew -p plugin publishPlugins
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
